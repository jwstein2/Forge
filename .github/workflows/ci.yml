# CI for the FORGE monorepo. Inert until the repo is pushed to GitHub (owner action).
# Runs typecheck, tests and the secret scan. It has NO deploy step and no Cloudflare credentials.
name: ci
on: [push, pull_request]
permissions: { contents: read }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run check
      - run: node scripts/check-secrets.mjs --history
